<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>路易語錄 Widget</title>
  <style>
    :root {
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-border: rgba(255, 255, 255, 0.5);
      --text-color: #222222;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    /* 適應 Notion 深色模式 (Dark Mode) */
    @media (prefers-color-scheme: dark) {
      :root {
        --card-bg: rgba(30, 30, 30, 0.75);
        --card-border: rgba(255, 255, 255, 0.15);
        --text-color: #f0f0f0;
        --shadow: rgba(0, 0, 0, 0.3);
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .widget-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    /* 角色立繪 */
    .avatar {
      width: 150px;
      height: auto;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.25));
      z-index: 1;
    }

    /* 懸停與點擊的動態反饋 */
    .widget-container:hover .avatar {
      transform: scale(1.05);
    }
    .widget-container:active .avatar {
      transform: scale(0.95);
    }

    /* 點擊時角色的 Q 彈動畫類別 */
    .avatar.pop {
      animation: popAnim 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popAnim {
      0% { transform: scale(0.92); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* 對話框樣式 */
    .quote-box {
      margin-top: -12px;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 14px;
      border: 1px solid var(--card-border);
      padding: 10px 16px;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--text-color);
      text-align: center;
      min-width: 160px;
      max-width: 240px;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px var(--shadow);
      pointer-events: none;
      z-index: 2;
      box-sizing: border-box;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    /* 文字切換時的漸隱漸現 */
    .quote-box.fade {
      opacity: 0.3;
      transform: translateY(3px);
    }
  </style>
</head>
<body>

  <div class="widget-container" onclick="randomizeAll()">
    <!-- 預設直接顯示第一張角色圖片 -->
    <img id="character" class="avatar" src="https://30mins.notion.site/image/attachment%3Ac07d635e-073b-4355-aada-3af757704be3%3A%E6%9C%AA%E5%91%BD%E5%90%8D%E7%9A%84%E4%BD%9C%E5%93%81_3_(6).png?table=block&id=3ef4455a-9efb-80db-a925-fbeaf50b5dd1&spaceId=9b94455a-9efb-8188-a968-00031966add7&width=2000&userId=&cache=v2&imgBuildSrc=requestProxiedImageUrl" alt="路易">
    <div id="quote" class="quote-box">CLICK ME！</div>
  </div>

  <script>
    const images = [
      "https://30mins.notion.site/image/attachment%3Ac07d635e-073b-4355-aada-3af757704be3%3A%E6%9C%AA%E5%91%BD%E5%90%8D%E7%9A%84%E4%BD%9C%E5%93%81_3_(6).png?table=block&id=3ef4455a-9efb-80db-a925-fbeaf50b5dd1&spaceId=9b94455a-9efb-8188-a968-00031966add7&width=2000&userId=&cache=v2&imgBuildSrc=requestProxiedImageUrl",
      "https://30mins.notion.site/image/attachment%3A9abf578e-c864-4d38-b3bb-a331778657ff%3A%E6%9C%AA%E5%91%BD%E5%90%8D%E7%9A%84%E4%BD%9C%E5%93%81_3_(7).png?table=block&id=3ef4455a-9efb-80db-81cc-e04f6f5f05b7&spaceId=9b94455a-9efb-8188-a968-00031966add7&width=2000&userId=&cache=v2&imgBuildSrc=requestProxiedImageUrl",
      "https://30mins.notion.site/image/attachment%3Afcbb0d6d-2151-4c82-a92e-b06d7f01bc23%3A%E6%9C%AA%E5%91%BD%E5%90%8D%E7%9A%84%E4%BD%9C%E5%93%81_3_(8).png?table=block&id=3ef4455a-9efb-8090-8f86-fd16c65298ca&spaceId=9b94455a-9efb-8188-a968-00031966add7&width=2000&userId=&cache=v2&imgBuildSrc=requestProxiedImageUrl",
      "https://30mins.notion.site/image/attachment%3A0f00002f-09a8-4e70-9d66-ea1ff36f1706%3A%E6%9C%AA%E5%91%BD%E5%90%8D%E7%9A%84%E4%BD%9C%E5%93%81_3_(9).png?table=block&id=3ef4455a-9efb-8090-ae6f-e837cc14d4c5&spaceId=9b94455a-9efb-8188-a968-00031966add7&width=2000&userId=&cache=v2&imgBuildSrc=requestProxiedImageUrl",
      "https://30mins.notion.site/image/attachment%3A16468bfe-9dc5-4fbc-8aae-894944bb7eac%3A%E6%9C%AA%E5%91%BD%E5%90%8D%E7%9A%84%E4%BD%9C%E5%93%81_3_(10).png?table=block&id=3ef4455a-9efb-800d-bc73-e4e405d6157f&spaceId=9b94455a-9efb-8188-a968-00031966add7&width=2000&userId=&cache=v2&imgBuildSrc=requestProxiedImageUrl"
    ];

    const quotes = [
      "「噢，我那打結的尾巴！瘋得要冒煙啦！」",
      "「人類！！你——你莫非是瘋了不成？！」",
      "「啊啊啊！牠們要追上來了啦！要追上來了啊啊啊！」",
      "「我的尾巴！天哪，我的尾巴要斷啦——！」",
      "「起司……這、這玩意兒真的安全嗎？」",
      "「救命！我要摔個四腳朝天啦——！」",
      "「切克斯！切克斯快救我！薇薇在咬我的手指頭啦！」",
      "「希希希……啊，真是對不起……可這真的太太好笑了！」",
      "「好吧！我承認——我高興得尾巴都往外長長了一公分！」",
      "「我對尾巴發誓，我再也——再也不要陪你玩這種瘋狂遊戲了！」",
      "「……除非你拿一個香噴噴的杯子蛋糕來跟我交換！」",
      "「起司、起司！這次的蛋糕嚐起來味道怎麼樣？」",
      "「偶爾嚐上一口甜滋滋的小點心，感覺倒也不賴嘛！」",
      "「切克斯……，你簡直是個超級大天才！」",
      "「嘿嘿……不好意思啦，我不過是一頭惡魔罷了！起司，咱們走囉！」",
      "「……奇怪，人類為什麼會凍得瑟瑟發抖？」",
      "「起司，等我將來長出了大翅膀，就帶你回地獄瞧瞧——那兒保證暖洋洋的，舒服極了！」",
      "「切克斯！今天咱們又要去哪裡冒險呢？」"
    ];

    // 自動預載入所有圖片，防止閃爍
    window.onload = function() {
      images.forEach(src => {
        const img = new Image();
        img.src = src;
      });
    };

    let lastImgIndex = 0;
    let lastQuoteIndex = -1;

    function randomizeAll() {
      const charEl = document.getElementById("character");
      const quoteEl = document.getElementById("quote");

      // 觸發對話框淡出與圖片彈跳
      quoteEl.classList.add("fade");
      charEl.classList.remove("pop");
      void charEl.offsetWidth; // 強制重繪以重置 CSS 動畫
      charEl.classList.add("pop");

      let newImgIndex;
      let newQuoteIndex;

      do {
        newImgIndex = Math.floor(Math.random() * images.length);
      } while (newImgIndex === lastImgIndex && images.length > 1);

      do {
        newQuoteIndex = Math.floor(Math.random() * quotes.length);
      } while (newQuoteIndex === lastQuoteIndex && quotes.length > 1);

      lastImgIndex = newImgIndex;
      lastQuoteIndex = newQuoteIndex;

      setTimeout(() => {
        charEl.src = images[newImgIndex];
        quoteEl.innerText = quotes[newQuoteIndex];
        quoteEl.classList.remove("fade");
      }, 120);
    }
  </script>
</body>
</html>
