<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>路易語錄 Widget</title>
  <style>
    :root {
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-border: rgba(255, 255, 255, 0.5);
      --text-color: #222222;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    /* 適應 Notion 深色模式 (Dark Mode) */
    @media (prefers-color-scheme: dark) {
      :root {
        --card-bg: rgba(30, 30, 30, 0.75);
        --card-border: rgba(255, 255, 255, 0.15);
        --text-color: #f0f0f0;
        --shadow: rgba(0, 0, 0, 0.3);
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .widget-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    /* 角色立繪 */
    .avatar {
      width: 150px;
      height: auto;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.25));
      z-index: 1;
    }

    /* 懸停與點擊的動態反饋 */
    .widget-container:hover .avatar {
      transform: scale(1.05);
    }
    .widget-container:active .avatar {
      transform: scale(0.95);
    }

    /* 點擊時角色的 Q 彈動畫類別 */
    .avatar.pop {
      animation: popAnim 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popAnim {
      0% { transform: scale(0.92); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* 對話框樣式 */
    .quote-box {
      margin-top: -12px;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 14px;
      border: 1px solid var(--card-border);
      padding: 10px 16px;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--text-color);
      text-align: center;
      min-width: 160px;
      max-width: 240px;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px var(--shadow);
      pointer-events: none;
      z-index: 2;
      box-sizing: border-box;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    /* 文字切換時的漸隱漸現 */
    .quote-box.fade {
      opacity: 0.3;
      transform: translateY(3px);
    }
  </style>
</head>
<body>

  <div class="widget-container" onclick="randomizeAll()">
    <!-- 預設直接顯示第一張角色圖片 -->
    <img id="character" class="avatar" src="https://30mins.notion.site/image/attachment%3Ac07d635e-073b-4355-aada-3af757704be3%3A%E6%9C%AA%E5%91%BD%E5%90%8D%E7%9A%84%E4%BD%9C%E5%93%81_3_(6).png?table=block&id=3ef4455a-9efb-80db-a925-fbeaf50b5dd1&spaceId=9b94455a-9efb-8188-a968-00031966add7&width=2000&userId=&cache=v2&imgBuildSrc=requestProxiedImageUrl" alt="路易">
    <div id="quote" class="quote-box">點擊路易，開啟對話！</div>
  </div>
